<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenQuartz - 开源项目展示</title>
    <meta name="description" content="OpenQuartz开源组织的项目展示网站，提供高质量Java开源项目，包括文件导出、事件总线、分布式ID等解决方案。">
    <meta name="keywords" content="OpenQuartz, Java, 开源项目, 文件导出, 事件总线, 分布式ID, Spring Cloud">
    <meta name="author" content="OpenQuartz">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Open Graph / 社交媒体元标签 -->
    <meta property="og:title" content="OpenQuartz - 开源项目展示">
    <meta property="og:description" content="OpenQuartz开源组织的项目展示网站，提供高质量Java开源项目。">
    <meta property="og:url" content="https://openquartz.github.io/">
    <meta property="og:type" content="website">
</head>
<body>
    <header>
        <div class="container">
            <h1>OpenQuartz</h1>
            <p class="subtitle">高质量Java开源项目集合</p>
        </div>
    </header>

    <section class="search-section">
        <div class="container">
            <div class="search-container">
                <h2>探索优秀的Java开源项目</h2>
                <p>OpenQuartz提供简洁、高效、可靠的Java开源解决方案</p>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索项目...">
                    <button id="search-button"><i class="fas fa-search"></i></button>
                </div>
            </div>
        </div>
    </section>

    <section class="projects-section">
        <div class="container">
            <h2>项目列表</h2>
            <div id="projects-container" class="projects-grid">
                <!-- 项目卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2023 OpenQuartz. 所有项目基于各自的开源协议。</p>
            <p>
                <a href="https://github.com/openquartz" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            </p>
        </div>
    </footer>

    <script src="js/projects.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
